# Firebase App Hosting config for the LJ Educare Next.js app.
# This file lives in the backend's ROOT DIRECTORY — set that to "web" when you
# create/configure the App Hosting backend in the Firebase console.
# Docs: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  maxInstances: 4
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # ── Firebase client config (PUBLIC — safe to commit; inlined into the browser
  #    bundle at build time). Available at BUILD by default. ──
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyCfl1nfoV09AkV7HjX7ImQizuuY2xtT4xg
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: ljeducare.firebaseapp.com
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: ljeducare
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: ljeducare.firebasestorage.app
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "852483320444"
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:852483320444:web:b81cae0f6ababfcc7bb7f9

  # ── Site identity ──
  - variable: NEXT_PUBLIC_SITE_NAME
    value: LJ Educare
  - variable: NEXT_PUBLIC_DEFAULT_CURRENCY
    value: LKR
  # The PUBLIC domain — this is what the site tells the outside world it is.
  # It feeds metadataBase (canonical + og:url), robots.txt, sitemap.xml, and the
  # verification URL + QR printed onto certificate PDFs. Certificates are handed to
  # students and cannot be recalled, so this must be the customer's own domain, never
  # the App Hosting URL. Keep the .hosted.app domain resolving regardless — QR codes on
  # certificates issued before 2026-07-16 still point at it.
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://ljeducare.com

  # ── Server-side secrets (Cloud Secret Manager). Create them first with:
  #      firebase apphosting:secrets:set AUTH_COOKIE_SIGNATURE_KEY_CURRENT
  #      firebase apphosting:secrets:set AUTH_COOKIE_SIGNATURE_KEY_PREVIOUS
  #      firebase apphosting:secrets:set REVALIDATE_SECRET
  #      firebase apphosting:secrets:set PORTAL_BRIDGE_SECRET ──
  - variable: AUTH_COOKIE_SIGNATURE_KEY_CURRENT
    secret: AUTH_COOKIE_SIGNATURE_KEY_CURRENT
  - variable: AUTH_COOKIE_SIGNATURE_KEY_PREVIOUS
    secret: AUTH_COOKIE_SIGNATURE_KEY_PREVIOUS
  - variable: REVALIDATE_SECRET
    secret: REVALIDATE_SECRET
  # Shared HMAC secret for the cross-app connector API (same value set on the
  # studentportal hub). Signs /api/connector/* requests.
  - variable: PORTAL_BRIDGE_SECRET
    secret: PORTAL_BRIDGE_SECRET
